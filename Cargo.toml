[package]
name = "salt-smb"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
slint = { version = "1.18", features = ["backend-qt"] }
smb2 = "0.37"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "time", "sync"] }
rfd = "0.15"
anyhow = "1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[build-dependencies]
slint-build = "1.18"
